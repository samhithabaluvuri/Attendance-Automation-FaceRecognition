<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ institution_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 950px;
            width: 100%;
            overflow: hidden;
            color: #1e293b;
        }
        .brand-panel {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }
        .brand-icon {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .form-panel {
            padding: 45px 40px;
            background: #ffffff;
        }
        .form-control {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: #2563eb;
            color: #0f172a;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .btn-primary {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-success {
            background: linear-gradient(90deg, #10b981, #059669);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }
        .role-badge {
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-weight: 600;
        }
        .btn-group .btn-check:checked + .btn-outline-primary {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="row g-0">
        <div class="col-md-5 brand-panel">
            <div class="brand-icon">🎓</div>
            <h3 class="fw-bold mb-2">{{ institution_name }}</h3>
            <p class="text-light opacity-75 mb-3">Biometric Attendance Management System</p>
            <span class="role-badge">FACULTY, STUDENT & ADMIN PORTAL</span>
        </div>
        <div class="col-md-7 form-panel">
            <h4 class="fw-bold mb-1">Sign In</h4>
            <p class="text-secondary small mb-4">Select your account role and enter your registered email address to receive an OTP.</p>

            <div class="mb-3">
                <label class="form-label small text-secondary d-block fw-semibold">Account Role</label>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="userRole" id="roleFaculty" value="FACULTY" checked>
                    <label class="btn btn-outline-primary py-2 small fw-semibold" for="roleFaculty">👨‍🏫 Faculty</label>

                    <input type="radio" class="btn-check" name="userRole" id="roleStudent" value="STUDENT">
                    <label class="btn btn-outline-primary py-2 small fw-semibold" for="roleStudent">🎓 Student</label>

                    <input type="radio" class="btn-check" name="userRole" id="roleAdmin" value="ADMIN">
                    <label class="btn btn-outline-primary py-2 small fw-semibold" for="roleAdmin">👨‍💼 Admin</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small text-secondary fw-semibold">Institutional Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@{{ institution_domain }}" required>
            </div>

            <button id="getOtpBtn" class="btn btn-primary w-100 mb-3">Send OTP</button>

            <div id="otpDiv" style="display: none;">
                <div class="mb-3">
                    <label for="otp" class="form-label small text-secondary fw-semibold">One-Time Password (OTP)</label>
                    <input type="text" class="form-control" id="otp" placeholder="Enter 6-digit OTP" required>
                </div>
                <button id="verifyOtpBtn" class="btn btn-success w-100">Verify & Access Portal</button>
            </div>

            <div id="statusAlert" class="mt-3 alert py-2 px-3 small" style="display: none;"></div>
        </div>
    </div>
</div>

<script>
function showAlert(msg, isError = false) {
    const alertDiv = document.getElementById("statusAlert");
    alertDiv.style.display = "block";
    alertDiv.className = `mt-3 alert py-2 px-3 small ${isError ? 'alert-danger' : 'alert-success'}`;
    alertDiv.textContent = msg;
}

document.getElementById("getOtpBtn").addEventListener("click", function() {
    let email = document.getElementById("email").value.trim();
    let selectedRole = document.querySelector('input[name="userRole"]:checked').value;

    if (!email) {
        showAlert("Please enter your email address.", true);
        return;
    }

    this.disabled = true;
    this.textContent = "Sending OTP...";
    document.getElementById("statusAlert").style.display = "none";

    fetch("/send-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, role: selectedRole })
    })
    .then(res => res.json().then(data => ({ status: res.status, body: data })))
    .then(result => {
        this.disabled = false;
        this.textContent = "Send OTP";
        if (result.status === 200) {
            showAlert(result.body.message, false);
            document.getElementById("otpDiv").style.display = "block";
        } else {
            showAlert(result.body.error || "Failed to send OTP.", true);
        }
    })
    .catch(err => {
        this.disabled = false;
        this.textContent = "Send OTP";
        showAlert("Network / server connection error. Please try again.", true);
    });
});

document.getElementById("verifyOtpBtn").addEventListener("click", function() {
    let email = document.getElementById("email").value.trim();
    let otp = document.getElementById("otp").value.trim();
    let selectedRole = document.querySelector('input[name="userRole"]:checked').value;

    if (!email || !otp) {
        showAlert("Please enter both email and OTP.", true);
        return;
    }

    fetch("/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, otp: otp, role: selectedRole })
    })
    .then(res => res.json().then(data => ({ status: res.status, body: data })))
    .then(result => {
        if (result.status === 200 && result.body.redirect) {
            window.location.href = result.body.redirect;
        } else {
            showAlert(result.body.error || "Invalid OTP verification code.", true);
        }
    })
    .catch(err => {
        showAlert("Verification failed due to a connection error.", true);
    });
});
</script>
</body>
</html>
